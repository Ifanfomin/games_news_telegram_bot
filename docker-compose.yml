services:
  postgres:
    image: postgres:latest
    container_name: ${POSTGRES_CONTAINE_NAME}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data/pgdata
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      postgres -c max_connections=1000
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true

  newsbot:
    build: 
      context: .
      dockerfile: Dockerfile
      # к сожалению у меня данный докер собирается только под проксёй, 
      # если запустить на заграничном сервере, то всё точно будет работать
      args:
        http_proxy: "http://127.0.0.1:8118"
        https_proxy: "http://127.0.0.1:8118"
      network: host

    environment:
      http_proxy: "http://127.0.0.1:8118"
      https_proxy: "http://127.0.0.1:8118"
      proxy_url: "socks5://127.0.0.1:8888"
      no_proxy: "localhost,127.0.0.1,.example.com"
    
    # dns:
    #   - 8.8.8.8
    #   - 1.1.1.1

    # network_mode: "host"

    volumes:
      - ./bot:/app/bot
      - ./main.py:/app/main.py
      - ./.env:/app/.env


    # command: /app/.venv/bin/python ./main.py
    command: python3 -m main
    depends_on:
      - postgres

volumes:
  pgdata:
    driver: local